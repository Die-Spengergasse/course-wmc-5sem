<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="538" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Daten von einer REST API typisieren</text>

  <!-- step 1: server -->
  <rect x="30" y="76" width="240" height="96" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">1 · SERVER</text>
  <text x="150" y="134" text-anchor="middle" font-size="15" font-family="Consolas, 'Cascadia Mono', monospace" fill="#1e293b">GET /api/playlists/42</text>
  <text x="150" y="158" text-anchor="middle" font-size="14" fill="#475569">schickt die Antwort</text>
  <line x1="274" y1="124" x2="316" y2="124" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 2: json text -->
  <rect x="320" y="76" width="260" height="96" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">2 · JSON (NUR TEXT)</text>
  <text x="450" y="134" text-anchor="middle" font-size="14" font-family="Consolas, 'Cascadia Mono', monospace" fill="#1e293b">{"name":"Coding Beats",</text>
  <text x="450" y="156" text-anchor="middle" font-size="14" font-family="Consolas, 'Cascadia Mono', monospace" fill="#1e293b"> "songs":[ … ]}</text>
  <line x1="584" y1="124" x2="626" y2="124" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 3: any -->
  <rect x="630" y="76" width="240" height="96" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="750" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">3 · response.json()</text>
  <text x="750" y="136" text-anchor="middle" font-size="20" font-weight="700" font-family="Consolas, 'Cascadia Mono', monospace" fill="#64748b">any</text>
  <text x="750" y="160" text-anchor="middle" font-size="14" fill="#64748b">TS kennt die Struktur nicht</text>

  <line x1="750" y1="176" x2="750" y2="206" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="736" y="198" text-anchor="end" font-size="14" font-weight="700" fill="#3178c6">4 · du gibst den Typ an</text>

  <!-- step 4: editor -->
  <rect x="30" y="212" width="840" height="190" rx="12" fill="#1e293b"/>
  <circle cx="52" cy="232" r="6" fill="#f87171"/><circle cx="72" cy="232" r="6" fill="#fbbf24"/><circle cx="92" cy="232" r="6" fill="#4ade80"/>
  <text x="120" y="237" font-size="13" fill="#94a3b8">app.ts</text>
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="16" fill="#e2e8f0">
    <text x="52" y="272"><tspan fill="#c4b5fd">const</tspan> response = <tspan fill="#c4b5fd">await</tspan> fetch(<tspan fill="#fcd34d">"/api/playlists/42"</tspan>);</text>
    <text x="52" y="302"><tspan fill="#c4b5fd">const</tspan> playlist<tspan fill="#ffffff" font-weight="700">: </tspan><tspan fill="#ffffff" font-weight="700" text-decoration="underline">Playlist</tspan> = <tspan fill="#c4b5fd">await</tspan> response.json();</text>
    <text x="52" y="332">console.log(playlist.songs[0].artist.<tspan fill="#ffffff">|</tspan></text>
  </g>
  <!-- autocomplete popup -->
  <rect x="386" y="342" width="230" height="52" rx="6" fill="#334155" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="388" y="344" width="226" height="24" rx="4" fill="#1d4ed8"/>
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" fill="#e2e8f0">
    <text x="398" y="361">name</text><text x="604" y="361" text-anchor="end" fill="#bfdbfe">string</text>
    <text x="398" y="386">verified</text><text x="604" y="386" text-anchor="end" fill="#94a3b8">boolean</text>
  </g>
  <text x="650" y="364" font-size="14" fill="#93c5fd">Der Editor kennt jetzt</text>
  <text x="650" y="384" font-size="14" fill="#93c5fd">jede Property.</text>

  <!-- warning -->
  <rect x="30" y="424" width="840" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="54" y="456" font-size="17" font-weight="700" fill="#92400e">⚠ Achtung: TypeScript glaubt dir einfach.</text>
  <text x="54" y="482" font-size="15" fill="#78350f">Beim Ausführen prüft niemand, ob die Daten wirklich zum Interface passen.</text>
  <text x="54" y="504" font-size="15" fill="#78350f">Dafür gibt es Type Guards. Sie kommen im nächsten Kapitel.</text>
</svg>
