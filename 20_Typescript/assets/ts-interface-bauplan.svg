<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="498" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Ein Interface ist ein Bauplan für Objekte</text>
  <text x="450" y="74" text-anchor="middle" font-size="16" fill="#64748b">Der Compiler vergleicht jedes Objekt mit dem Bauplan.</text>

  <!-- interface -->
  <rect x="30" y="104" width="300" height="200" rx="12" fill="#eff6ff" stroke="#3178c6" stroke-width="2"/>
  <text x="46" y="130" font-size="13" font-weight="700" fill="#3178c6" letter-spacing="1">BAUPLAN</text>
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="16" fill="#1e293b">
    <text x="46" y="164"><tspan fill="#7c3aed">interface</tspan> Song {</text>
    <text x="66" y="196">title: <tspan fill="#3178c6">string</tspan>;</text>
    <text x="66" y="226">durationSec: <tspan fill="#3178c6">number</tspan>;</text>
    <text x="66" y="256">explicit<tspan fill="#ea580c" font-weight="700">?</tspan>: <tspan fill="#3178c6">boolean</tspan>;</text>
    <text x="46" y="286">}</text>
  </g>
  <rect x="30" y="322" width="300" height="88" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="46" y="352" font-size="16" fill="#9a3412"><tspan font-family="Consolas, 'Cascadia Mono', monospace" font-weight="700" font-size="20">?</tspan>  = optional</text>
  <text x="46" y="380" font-size="15" fill="#9a3412">Die Property darf fehlen.</text>
  <text x="46" y="400" font-size="15" fill="#9a3412">Alle anderen müssen da sein.</text>

  <!-- objects -->
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" fill="#1e293b">
    <!-- ok 1 -->
    <rect x="360" y="104" width="510" height="78" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="390" cy="143" r="16" fill="#16a34a"/>
    <text x="390" y="149" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="'Segoe UI', sans-serif">✔</text>
    <text x="420" y="132">{ title: "Lofi Loop", durationSec: 182,</text>
    <text x="420" y="151">  explicit: false }</text>
    <text x="420" y="173" font-family="'Segoe UI', sans-serif" font-size="14" fill="#166534">Alles passt.</text>

    <!-- ok 2 -->
    <rect x="360" y="196" width="510" height="78" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="390" cy="235" r="16" fill="#16a34a"/>
    <text x="390" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="'Segoe UI', sans-serif">✔</text>
    <text x="420" y="232">{ title: "Null &amp; Void", durationSec: 201 }</text>
    <text x="420" y="258" font-family="'Segoe UI', sans-serif" font-size="14" fill="#166534">explicit fehlt, aber das ist optional. Passt.</text>

    <!-- error 1 -->
    <rect x="360" y="288" width="510" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="390" cy="327" r="16" fill="#dc2626"/>
    <text x="390" y="333" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="'Segoe UI', sans-serif">✘</text>
    <text x="420" y="324">{ title: "404 Love", durationSec: <tspan fill="#dc2626" font-weight="700">"3:20"</tspan> }</text>
    <text x="420" y="350" font-family="'Segoe UI', sans-serif" font-size="14" fill="#991b1b">"3:20" ist ein string, keine number.</text>

    <!-- error 2 -->
    <rect x="360" y="380" width="510" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="390" cy="419" r="16" fill="#dc2626"/>
    <text x="390" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="'Segoe UI', sans-serif">✘</text>
    <text x="420" y="416">{ <tspan fill="#dc2626" font-weight="700">titel</tspan>: "Byte Me", durationSec: 150 }</text>
    <text x="420" y="442" font-family="'Segoe UI', sans-serif" font-size="14" fill="#991b1b">Tippfehler: titel gibt es nicht, title fehlt.</text>
  </g>
</svg>
