<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="378" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Arbeiten mit KI: Wer macht was?</text>
  <rect x="290" y="62" width="14" height="14" rx="3" fill="#3178c6"/>
  <text x="310" y="74" font-size="14" fill="#475569">ohne KI: dein Kopf</text>
  <rect x="470" y="62" width="14" height="14" rx="3" fill="#7c3aed"/>
  <text x="490" y="74" font-size="14" fill="#475569">mit KI: die KI tippt</text>

  <g font-size="14" text-anchor="middle">
    <!-- 1 -->
    <rect x="24" y="96" width="158" height="200" rx="14" fill="#eff6ff" stroke="#3178c6" stroke-width="2"/>
    <rect x="24" y="96" width="158" height="30" rx="14" fill="#3178c6"/><rect x="24" y="112" width="158" height="14" fill="#3178c6"/>
    <text x="103" y="117" fill="#fff" font-weight="700" font-size="13" letter-spacing="1">OHNE KI</text>
    <text x="103" y="170" font-size="34" font-weight="800" fill="#3178c6">1</text>
    <text x="103" y="202" font-size="17" font-weight="700" fill="#1e293b">Verstehen</text>
    <text x="103" y="232" fill="#334155">JSON im Browser</text>
    <text x="103" y="252" fill="#334155">ansehen und als</text>
    <text x="103" y="272" fill="#334155">Baum zeichnen</text>

    <!-- 2 -->
    <rect x="196" y="96" width="158" height="200" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="196" y="96" width="158" height="30" rx="14" fill="#7c3aed"/><rect x="196" y="112" width="158" height="14" fill="#7c3aed"/>
    <text x="275" y="117" fill="#fff" font-weight="700" font-size="13" letter-spacing="1">MIT KI</text>
    <text x="275" y="170" font-size="34" font-weight="800" fill="#7c3aed">2</text>
    <text x="275" y="202" font-size="17" font-weight="700" fill="#1e293b">Generieren</text>
    <text x="275" y="232" fill="#334155">KI erstellt</text>
    <text x="275" y="252" fill="#334155">Interfaces aus</text>
    <text x="275" y="272" fill="#334155">nur einer Antwort</text>

    <!-- 3 -->
    <rect x="368" y="96" width="158" height="200" rx="14" fill="#eff6ff" stroke="#3178c6" stroke-width="2"/>
    <rect x="368" y="96" width="158" height="30" rx="14" fill="#3178c6"/><rect x="368" y="112" width="158" height="14" fill="#3178c6"/>
    <text x="447" y="117" fill="#fff" font-weight="700" font-size="13" letter-spacing="1">OHNE KI</text>
    <text x="447" y="170" font-size="34" font-weight="800" fill="#3178c6">3</text>
    <text x="447" y="202" font-size="17" font-weight="700" fill="#1e293b">Prüfen</text>
    <text x="447" y="232" fill="#334155">Doku + Compiler:</text>
    <text x="447" y="252" fill="#334155">Wo liegt die KI</text>
    <text x="447" y="272" fill="#334155">falsch?</text>

    <!-- 4 -->
    <rect x="540" y="96" width="158" height="200" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="540" y="96" width="158" height="30" rx="14" fill="#7c3aed"/><rect x="540" y="112" width="158" height="14" fill="#7c3aed"/>
    <text x="619" y="117" fill="#fff" font-weight="700" font-size="13" letter-spacing="1">MIT KI</text>
    <text x="619" y="170" font-size="34" font-weight="800" fill="#7c3aed">4</text>
    <text x="619" y="202" font-size="17" font-weight="700" fill="#1e293b">Bauen</text>
    <text x="619" y="232" fill="#334155">Abfahrtsmonitor</text>
    <text x="619" y="252" fill="#334155">mit fetch und</text>
    <text x="619" y="272" fill="#334155">deinen Interfaces</text>

    <!-- 5 -->
    <rect x="712" y="96" width="158" height="200" rx="14" fill="#eff6ff" stroke="#3178c6" stroke-width="2"/>
    <rect x="712" y="96" width="158" height="30" rx="14" fill="#3178c6"/><rect x="712" y="112" width="158" height="14" fill="#3178c6"/>
    <text x="791" y="117" fill="#fff" font-weight="700" font-size="13" letter-spacing="1">OHNE KI</text>
    <text x="791" y="170" font-size="34" font-weight="800" fill="#3178c6">5</text>
    <text x="791" y="202" font-size="17" font-weight="700" fill="#1e293b">Live-Check</text>
    <text x="791" y="232" fill="#334155">API ändert sich:</text>
    <text x="791" y="252" fill="#334155">du passt an und</text>
    <text x="791" y="272" fill="#334155">erklärst den Code</text>
  </g>

  <rect x="24" y="316" width="846" height="46" rx="12" fill="#1e293b"/>
  <text x="447" y="346" text-anchor="middle" font-size="17" fill="#ffffff">Die KI darf tippen. <tspan font-weight="700" fill="#93c5fd">Verstehen und prüfen musst du selbst.</tspan></text>
</svg>
