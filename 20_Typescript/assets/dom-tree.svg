<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1d1d1b">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a35f00"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="838" height="558" rx="12" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>

  <!-- left: HTML source -->
  <text x="160" y="36" text-anchor="middle" font-size="16" font-weight="bold">HTML (Text in der Datei)</text>
  <rect x="16" y="50" width="288" height="246" rx="8" fill="#ededed" stroke="#9d9d9c" stroke-width="1.5"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14" xml:space="preserve">
    <text x="28" y="78">&lt;body&gt;</text>
    <text x="28" y="104">  &lt;h1 id="title"&gt;Canteen&lt;/h1&gt;</text>
    <text x="28" y="130">  &lt;ul id="dishList"&gt;</text>
    <text x="28" y="156">    &lt;li class="dish"&gt;</text>
    <text x="28" y="182">      Pumpkin soup</text>
    <text x="28" y="208">      &lt;button&gt;Add&lt;/button&gt;</text>
    <text x="28" y="234">    &lt;/li&gt;</text>
    <text x="28" y="260">  &lt;/ul&gt;</text>
    <text x="28" y="286">&lt;/body&gt;</text>
  </g>

  <!-- parse arrow -->
  <line x1="160" y1="312" x2="160" y2="352" stroke="#a35f00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="378" text-anchor="middle" font-size="15">Der Browser liest das HTML</text>
  <text x="160" y="398" text-anchor="middle" font-size="15">und baut daraus Objekte:</text>
  <text x="160" y="418" text-anchor="middle" font-size="15" font-weight="bold">den DOM Tree</text>
  <text x="160" y="446" text-anchor="middle" font-size="14" fill="#5f5f5e">JavaScript ändert nur den Baum,</text>
  <text x="160" y="466" text-anchor="middle" font-size="14" fill="#5f5f5e">nie die Datei.</text>

  <!-- right: tree -->
  <text x="580" y="36" text-anchor="middle" font-size="16" font-weight="bold">DOM Tree (Objekte im Speicher)</text>

  <!-- edges -->
  <g stroke="#5f5f5e" stroke-width="1.5" fill="none">
    <line x1="540" y1="84" x2="540" y2="106"/>
    <line x1="540" y1="140" x2="430" y2="162"/>
    <line x1="540" y1="140" x2="610" y2="162"/>
    <line x1="610" y1="196" x2="500" y2="218"/>
    <line x1="610" y1="196" x2="680" y2="218"/>
    <line x1="500" y1="266" x2="500" y2="304"/>
    <line x1="680" y1="266" x2="680" y2="304"/>
    <line x1="680" y1="352" x2="590" y2="390"/>
    <line x1="680" y1="352" x2="750" y2="390"/>
    <line x1="750" y1="424" x2="750" y2="462"/>
  </g>

  <!-- document -->
  <rect x="470" y="50" width="140" height="34" rx="6" fill="#fdebd1" stroke="#f39000" stroke-width="3"/>
  <text x="540" y="73" text-anchor="middle" font-size="15" font-weight="bold" font-family="Consolas, Menlo, monospace">document</text>

  <!-- elements -->
  <g font-family="Consolas, Menlo, monospace" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="490" y="106" width="100" height="34" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
    <text x="540" y="129">&lt;html&gt;</text>
    <rect x="380" y="162" width="100" height="34" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
    <text x="430" y="185">&lt;head&gt;</text>
    <rect x="560" y="162" width="100" height="34" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
    <text x="610" y="185">&lt;body&gt;</text>
    <rect x="435" y="218" width="130" height="48" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
    <text x="500" y="238">&lt;h1&gt;</text>
    <rect x="610" y="218" width="140" height="48" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
    <text x="680" y="238">&lt;ul&gt;</text>
    <rect x="615" y="304" width="130" height="48" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
    <text x="680" y="324">&lt;li&gt;</text>
    <rect x="695" y="390" width="110" height="34" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
    <text x="750" y="413">&lt;button&gt;</text>
  </g>
  <!-- attributes -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" text-anchor="middle" fill="#00628f">
    <text x="500" y="257">id="title"</text>
    <text x="680" y="257">id="dishList"</text>
    <text x="680" y="343">class="dish"</text>
  </g>

  <!-- text nodes -->
  <g font-size="15" text-anchor="middle">
    <rect x="445" y="304" width="110" height="34" rx="17" fill="#e5f1d9" stroke="#4a7a1c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="500" y="327">"Canteen"</text>
    <rect x="515" y="390" width="150" height="34" rx="17" fill="#e5f1d9" stroke="#4a7a1c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="413">"Pumpkin soup"</text>
    <rect x="710" y="462" width="80" height="34" rx="17" fill="#e5f1d9" stroke="#4a7a1c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="750" y="485">"Add"</text>
  </g>

  <!-- relations between ul and li -->
  <g font-size="14" font-family="Consolas, Menlo, monospace" fill="#a35f00">
    <text x="673" y="283" text-anchor="end">children[0] ↓</text>
    <text x="687" y="296" text-anchor="start">↑ parentElement</text>
  </g>

  <!-- legend -->
  <line x1="16" y1="512" x2="824" y2="512" stroke="#9d9d9c" stroke-width="1"/>
  <rect x="24" y="524" width="44" height="24" rx="4" fill="#fdebd1" stroke="#f39000" stroke-width="3"/>
  <text x="76" y="541" font-size="14">Dokument</text>
  <rect x="160" y="524" width="44" height="24" rx="4" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
  <text x="212" y="541" font-size="14">Element (Tag)</text>
  <text x="330" y="541" font-size="14" font-family="Consolas, Menlo, monospace" fill="#00628f">id="…"</text>
  <text x="392" y="541" font-size="14">Attribut</text>
  <rect x="476" y="524" width="44" height="24" rx="12" fill="#e5f1d9" stroke="#4a7a1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="541" font-size="14">Text-Knoten</text>
  <text x="636" y="541" font-size="14" fill="#5f5f5e">(Zeilenumbrüche fehlen)</text>
</svg>
