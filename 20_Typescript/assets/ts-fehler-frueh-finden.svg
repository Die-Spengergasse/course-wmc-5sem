<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cost" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.5" stop-color="#eab308"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="468" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Wann findest du einen Fehler?</text>
  <text x="450" y="76" text-anchor="middle" font-size="16" fill="#64748b">Beispiel: Tippfehler <tspan font-family="Consolas, 'Cascadia Mono', monospace" fill="#dc2626">song.titel</tspan> statt <tspan font-family="Consolas, 'Cascadia Mono', monospace" fill="#16a34a">song.title</tspan></text>

  <!-- timeline -->
  <line x1="150" y1="130" x2="850" y2="130" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="852" y="112" text-anchor="end" font-size="14" fill="#64748b">Zeit</text>
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="150" cy="130" r="24" fill="#334155"/><text x="150" y="137">1</text>
    <circle cx="360" cy="130" r="24" fill="#334155"/><text x="360" y="137">2</text>
    <circle cx="570" cy="130" r="24" fill="#334155"/><text x="570" y="137">3</text>
    <circle cx="780" cy="130" r="24" fill="#334155"/><text x="780" y="137">4</text>
  </g>
  <g font-size="16" font-weight="600" text-anchor="middle" fill="#1e293b">
    <text x="150" y="180">Code schreiben</text>
    <text x="360" y="180">Kompilieren</text>
    <text x="570" y="180">Programm starten</text>
    <text x="780" y="180">User nutzt die App</text>
  </g>

  <!-- TypeScript row -->
  <rect x="24" y="222" width="112" height="34" rx="17" fill="#3178c6"/>
  <text x="80" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TypeScript</text>
  <line x1="150" y1="192" x2="150" y2="214" stroke="#3178c6" stroke-width="3" stroke-dasharray="5 4"/>
  <rect x="150" y="214" width="420" height="78" rx="12" fill="#eff6ff" stroke="#3178c6" stroke-width="2"/>
  <text x="168" y="242" font-size="17" font-family="Consolas, 'Cascadia Mono', monospace" fill="#1e293b">console.log(song.<tspan fill="#dc2626">titel</tspan>);</text>
  <path d="M327,250 q4,5 8,0 t8,0 t8,0 t8,0 t8,0" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="168" y="278" font-size="15" fill="#1e40af"><tspan font-weight="700" fill="#16a34a">✔ Sofort sichtbar:</tspan> rote Wellenlinie im Editor</text>

  <!-- JavaScript row -->
  <rect x="24" y="322" width="112" height="34" rx="17" fill="#f7df1e"/>
  <text x="80" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">JavaScript</text>
  <line x1="570" y1="192" x2="570" y2="314" stroke="#ca8a04" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="780" y1="192" x2="780" y2="314" stroke="#ca8a04" stroke-width="3" stroke-dasharray="5 4"/>
  <rect x="440" y="314" width="436" height="78" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="458" y="342" font-size="17" font-family="Consolas, 'Cascadia Mono', monospace" fill="#1e293b">&gt; <tspan fill="#dc2626">undefined</tspan></text>
  <text x="458" y="378" font-size="15" fill="#713f12"><tspan font-weight="700" fill="#dc2626">✘ Erst beim Ausführen:</tspan> falsche Werte oder Absturz</text>

  <!-- cost bar -->
  <rect x="150" y="420" width="630" height="14" rx="7" fill="url(#cost)"/>
  <text x="150" y="410" font-size="14" fill="#15803d" font-weight="600">Fehler beheben: schnell und billig</text>
  <text x="780" y="410" text-anchor="end" font-size="14" fill="#b91c1c" font-weight="600">langsam und teuer</text>
</svg>
